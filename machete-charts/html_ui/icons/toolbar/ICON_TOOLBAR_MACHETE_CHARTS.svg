  <line x1="18" y1="18" x2="46" y2="18" stroke="white" stroke-width="2"/>
  <line x1="18" y1="24" x2="40" y2="24" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="18" y1="29" x2="42" y2="29" stroke="white" stroke-width="1.5" opacity="0.7"/>
