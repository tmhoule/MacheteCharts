<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="/SCSS/common.css" />
  <link rel="stylesheet" href="MacheteCharts.css">

  <script type="text/javascript" src="/JS/coherent.js"></script>
  <script type="text/javascript" src="/JS/common.js"></script>
  <script type="text/javascript" src="/JS/dataStorage.js"></script>
  <script type="text/javascript" src="/JS/buttons.js"></script>
  <script type="text/javascript" src="/JS/Services/ToolBarPanels.js"></script>
  <script type="text/javascript" src="/Pages/VCockpit/Instruments/Shared/BaseInstrument.js"></script>

  <link rel="import" href="/templates/ingameUi/ingameUi.html" />
  <link rel="import" href="/templates/ingameUiHeader/ingameUiHeader.html" />

  <script type="text/javascript" defer src="MacheteCharts.js"></script>
</head>
<body class="border-box" id="machete-charts-body">
  <machete-charts-panel>
    <ingame-ui id="MacheteChartsPanel" panel-id="MACHETE_CHARTS_PANEL" title="Machete Charts" class="ingameUiFrame panelInvisible" content-fit="true">
      <div id="app">
        <div class="header">
          <div class="header-top">
            <h1>Machete Charts</h1>
            <div class="text-size-controls">
              <button id="textSmaller" title="Smaller text">A-</button>
              <button id="textBigger" title="Bigger text">A+</button>
            </div>
          </div>
          <div class="search-wrapper">
            <div class="search-box">
              <input type="text" id="searchInput" placeholder="Airport ID (e.g. BOS, LFPG)" maxlength="5" autocomplete="off" spellcheck="false">
              <button id="searchBtn">Search</button>
              <button id="clearBtn">Clear</button>
            </div>
            <div class="search-results" id="searchResults"></div>
          </div>
        </div>
        <div class="content" id="content">
          <div class="empty-state">
            <h2>Terminal Procedures</h2>
            <div class="region">US & European airports</div>
            <p>Enter an airport identifier to view charts.</p>
            <div class="branding">hermes-tv.com</div>
          </div>
        </div>
        <div class="osk" id="onScreenKeyboard"></div>
      </div>
    </ingame-ui>
  </machete-charts-panel>
</body>
</html>
